version: '3'

vars:
  RELEASE_PLATFORMS: darwin/universal,windows/amd64,windows/arm64,linux/amd64,linux/arm64,android,web

tasks:
  dev:
    desc: Run the app with live reload
    cmds:
      - go tool mygo dev

  dev-android:
    desc: Run the app on a connected Android device or emulator
    cmds:
      - go tool mygo dev -platform android

  build:
    desc: Build a production app for the current host
    env:
      GOFLAGS: -trimpath
      MYGO_LDFLAGS: "-s -w"
    vars:
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH
    cmds:
      - go tool mygo build -platform {{.GOOS}}/{{.GOARCH}}

  build-android:
    desc: Build Android APK and AAB packages
    env:
      GOFLAGS: -trimpath
      MYGO_LDFLAGS: "-s -w"
    cmds:
      - go tool mygo build -platform android/arm64

  release:
    desc: Build production artifacts for all supported platforms
    env:
      GOFLAGS: -trimpath
      MYGO_LDFLAGS: "-s -w"
    cmds:
      - go tool mygo build -platform {{.RELEASE_PLATFORMS}}