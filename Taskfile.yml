version: '3'

vars:
  RELEASE_PLATFORMS: darwin/universal,darwin/arm64,darwin/amd64,windows/amd64,windows/arm64,linux/amd64,linux/arm64,android/arm64
  RELEASE_VERSION:
    sh: awk -F '"' '/"version"[[:space:]]*:/ { print $4; exit }' mygo.json

tasks:
  dev:
    desc: Run the app with live reload
    cmds:
      - go tool mygo dev

  dev-android:
    desc: Run the app on a connected Android device or emulator
    cmds:
      - go tool mygo dev -platform android

  build:
    desc: Build a production app for the current host
    env:
      GOFLAGS: -trimpath
      MYGO_LDFLAGS: "-s -w"
    vars:
      GOOS:
        sh: go env GOOS
      GOARCH:
        sh: go env GOARCH
    cmds:
      - go tool mygo build -platform {{.GOOS}}/{{.GOARCH}}

  build-android:
    desc: Build Android APK and AAB packages
    env:
      GOFLAGS: -trimpath
      MYGO_LDFLAGS: "-s -w"
    cmds:
      - go tool mygo build -platform android/arm64

  db-generate:
    desc: Generate GORM models and query code from Goose migrations
    cmds:
      - go run ./cmd/mtool -d build/kapp.db -t up
      - go run ./cmd/mtool -d build/kapp.db -g

  db-migrations:
    desc: List embedded Goose migration files
    cmds:
      - ls internal/data/sql/*.sql

  release:
    desc: Build production artifacts for all supported platforms
    env:
      GOFLAGS: -trimpath
      MYGO_LDFLAGS: "-s -w"
    cmds:
      - rm -rf build dist
      - mkdir -p build dist
      - go tool mygo build -platform {{.RELEASE_PLATFORMS}}
      - tar -czf dist/kapp-{{.RELEASE_VERSION}}-darwin-universal.tar.gz -C build/darwin-universal kapp.app
      - tar -czf dist/kapp-{{.RELEASE_VERSION}}-darwin-arm64.tar.gz -C build/darwin-arm64 kapp.app
      - tar -czf dist/kapp-{{.RELEASE_VERSION}}-darwin-amd64.tar.gz -C build/darwin-amd64 kapp.app
      - cp build/darwin-universal/kapp-{{.RELEASE_VERSION}}.dmg dist/kapp-{{.RELEASE_VERSION}}-darwin-universal.dmg
      - cp build/darwin-arm64/kapp-{{.RELEASE_VERSION}}-arm64.dmg dist/kapp-{{.RELEASE_VERSION}}-darwin-arm64.dmg
      - cp build/darwin-amd64/kapp-{{.RELEASE_VERSION}}-amd64.dmg dist/kapp-{{.RELEASE_VERSION}}-darwin-amd64.dmg
      - cp build/linux-amd64/kapp_{{.RELEASE_VERSION}}_amd64.deb dist/kapp-{{.RELEASE_VERSION}}-linux-amd64.deb
      - cp build/linux-amd64/kapp-{{.RELEASE_VERSION}}-1.x86_64.rpm dist/kapp-{{.RELEASE_VERSION}}-linux-amd64.rpm
      - cp build/linux-amd64/kapp-{{.RELEASE_VERSION}}-linux-amd64.tar.gz dist/kapp-{{.RELEASE_VERSION}}-linux-amd64.tar.gz
      - cp build/linux-arm64/kapp_{{.RELEASE_VERSION}}_arm64.deb dist/kapp-{{.RELEASE_VERSION}}-linux-arm64.deb
      - cp build/linux-arm64/kapp-{{.RELEASE_VERSION}}-1.aarch64.rpm dist/kapp-{{.RELEASE_VERSION}}-linux-arm64.rpm
      - cp build/linux-arm64/kapp-{{.RELEASE_VERSION}}-linux-arm64.tar.gz dist/kapp-{{.RELEASE_VERSION}}-linux-arm64.tar.gz
      - cp build/windows-amd64/kapp.exe dist/kapp-{{.RELEASE_VERSION}}-windows-amd64.exe
      - cp build/windows-arm64/kapp.exe dist/kapp-{{.RELEASE_VERSION}}-windows-arm64.exe
      - cp build/android/kapp-{{.RELEASE_VERSION}}.apk dist/kapp-{{.RELEASE_VERSION}}-android-arm64.apk
      - cp build/android/kapp-{{.RELEASE_VERSION}}.aab dist/kapp-{{.RELEASE_VERSION}}-android-arm64.aab